name: NovaCore native editor candidate

on:
  pull_request:
    paths:
      - 'tools/world_editor/**'
      - 'engine/**'
      - 'shaders/**'
      - 'CMakeLists.txt'
      - '.github/workflows/editor-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software-vulkan:
    name: SDL3 / Vulkan software smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native dependencies and software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslc mesa-vulkan-drivers vulkan-validationlayers xvfb xauth libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxkbcommon-dev libudev-dev libasound2-dev
      - name: Configure mandatory native editor
        run: cmake --preset linux-clang-debug -DNOVACORE_BUILD_WORLD_EDITOR=ON -DNOVACORE_REQUIRE_EDITOR_NATIVE=ON
      - name: Build native code and Vulkan shaders
        run: cmake --build --preset linux-clang-debug --target novacore_world_editor --parallel 2
      - name: CPU editor contracts in native build
        run: ctest --test-dir build/linux-clang-debug -R '^novacore_world_editor_' --output-on-failure
      - name: Submit frames with software Vulkan and validation layers
        shell: bash
        run: |
          set -o pipefail
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"
          export VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation
          export SDL_VIDEODRIVER=x11
          timeout 60s xvfb-run -a -s '-screen 0 1280x800x24' build/linux-clang-debug/novacore_world_editor --vulkan-smoke 2>&1 | tee editor-vulkan-smoke.log
          grep -Eq '^NOVACORE_EDITOR_READY backend=vulkan-world frames=[3-9][0-9]* boxes=[1-9][0-9]* lines=[1-9][0-9]* extent=1280x800          if grep -Ei 'Validation Error|ERROR / SPEC|VUID-' editor-vulkan-smoke.log; then exit 1; fi
      - name: Record validation scope
        if: always()
        run: echo 'Software Vulkan (lavapipe), virtual display, native build and submitted-frame smoke only. No physical GPU, interactive visual/input or game round-trip acceptance.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editor-software-vulkan-smoke
          path: editor-vulkan-smoke.log
          retention-days: 7
          if-no-files-found: warn
 editor-vulkan-smoke.log
          grep -q 'Vulkan editor smoke passed: backend=vulkan-world' editor-vulkan-smoke.log
          if grep -Ei 'Validation Error|ERROR / SPEC|VUID-' editor-vulkan-smoke.log; then exit 1; fi
      - name: Record validation scope
        if: always()
        run: echo 'Software Vulkan (lavapipe), virtual display, native build and submitted-frame smoke only. No physical GPU, interactive visual/input or game round-trip acceptance.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editor-software-vulkan-smoke
          path: editor-vulkan-smoke.log
          retention-days: 7
          if-no-files-found: warn
